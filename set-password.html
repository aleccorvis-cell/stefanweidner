<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Passwort festlegen - Written in Sound</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="admin/css/admin.css">
</head>

<body>
    <div class="login-screen">
        <form id="setPasswordForm" class="login-card">
            <div class="login-logo">
                <svg viewBox="0 0 40 24" width="34" height="20" aria-hidden="true">
                    <path class="wave-line wave-line-1" d="M2,12 C5,7 7,17 10,12 C12,9 13,15 15,12" />
                    <path class="wave-line wave-line-2" d="M2,12 C5,4 7,20 10,12 C12,7 13,17 15,12" />
                    <path class="wave-line wave-line-3" d="M2,12 C5,1 7,23 10,12 C12,5 13,19 15,12" />
                </svg>
                <span>W<span class="nav-logo-divider">|</span>S</span>
            </div>
            <p style="text-align:center; color:var(--color-text-secondary); font-size:var(--text-sm);">
                Neues Passwort festlegen
            </p>
            <div class="form-group">
                <label class="form-label" for="pwInput">Neues Passwort (mind. 8 Zeichen)</label>
                <input class="form-input" type="password" id="pwInput" required minlength="8"
                    autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="pwInput2">Wiederholen</label>
                <input class="form-input" type="password" id="pwInput2" required minlength="8"
                    autocomplete="new-password">
            </div>
            <p id="setPwError" class="form-error" style="display:none;"></p>
            <p id="setPwSuccess" class="form-error" style="display:none; color:#4ade80;"></p>
            <button type="submit" class="btn btn-primary" style="width:100%;">Passwort speichern</button>
        </form>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const token = params.get('token') || '';
        const form = document.getElementById('setPasswordForm');
        const errorEl = document.getElementById('setPwError');
        const successEl = document.getElementById('setPwSuccess');

        if (!token) {
            errorEl.textContent = 'Kein gültiger Link. Bitte den Link aus deiner E-Mail vollständig öffnen.';
            errorEl.style.display = 'block';
            form.querySelector('button').disabled = true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            const pw1 = document.getElementById('pwInput').value;
            const pw2 = document.getElementById('pwInput2').value;

            if (pw1 !== pw2) {
                errorEl.textContent = 'Die Passwörter stimmen nicht überein.';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('backend/api/auth/set-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: pw1 }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Fehler');

                successEl.textContent = 'Passwort gespeichert! Du kannst dich jetzt im Admin-Dashboard anmelden.';
                successEl.style.display = 'block';
                form.querySelector('button').disabled = true;
                setTimeout(() => { location.href = 'admin/index.html'; }, 2000);
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>

</html>
