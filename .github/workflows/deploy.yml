name: Deploy to Strato

# Bei jedem Push auf main wird der komplette Stand automatisch per SFTP
# auf den Strato-Webspace synchronisiert. Erfordert diese Repository-Secrets
# (Settings -> Secrets and variables -> Actions), die NUR im Browser vom
# Repo-Owner selbst angelegt werden - niemals von Claude:
#   STRATO_SFTP_HOST      z.B. 5021507168.ssh.w2.strato.hosting
#   STRATO_SFTP_USER      SFTP-Benutzername
#   STRATO_SFTP_PASSWORD  SFTP-Passwort
#   STRATO_REMOTE_PATH    Zielverzeichnis auf dem Server, z.B. /
#
# Nutzt lftp (reines SFTP-Protokoll) statt einer Docker-Action, weil der
# Strato-Zugang bewusst als "SFTP ohne SSH" angelegt ist - Tools, die einen
# SSH-Exec-Kanal fuer Befehle wie "mkdir" brauchen, schlagen damit fehl.
# lftp spricht nur das SFTP-Protokoll selbst (kein Shell-Zugriff noetig).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Per SFTP auf Strato synchronisieren
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.STRATO_REMOTE_PATH }}
        run: |
          lftp -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            open -u ${SFTP_USER},${SFTP_PASSWORD} sftp://${SFTP_HOST};
            mirror --reverse --verbose \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .claude/ \
              --exclude-glob backend/config.php \
              --exclude-glob backend/config.production-ready.php \
              --exclude-glob backend/dev.sqlite \
              --exclude-glob infrastructure.local.md \
              ./ ${REMOTE_PATH};
            bye
          "
