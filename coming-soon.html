<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                if (localStorage.getItem('wis-theme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) { }
        })();
    </script>
    <meta name="robots" content="noindex">
    <meta name="description" content="Written in Sound - Stefan Weidner. Die neue Website entsteht gerade.">
    <title>Written in Sound - Demnächst verfügbar</title>

    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" href="assets/images/favicon.png">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .cs-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-xl);
        }

        .cs-logo {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-2xl);
        }

        .cs-logo .wave-line {
            fill: none;
            stroke: var(--color-gold);
            stroke-width: 1.4;
            stroke-linecap: round;
        }

        .cs-logo .wave-line-1 {
            opacity: 0.45;
        }

        .cs-logo .wave-line-2 {
            opacity: 0.7;
        }

        .cs-logo-text {
            font-family: var(--font-display);
            font-size: var(--text-xl);
            color: var(--color-gold);
            letter-spacing: 0.05em;
        }

        .cs-title {
            font-family: var(--font-display);
            font-size: var(--text-4xl);
            letter-spacing: 0.03em;
            margin-bottom: var(--space-sm);
        }

        .cs-claim {
            font-family: var(--font-secondary);
            color: var(--color-gold);
            font-size: var(--text-lg);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: var(--space-xl);
        }

        .cs-text {
            max-width: 480px;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-2xl);
        }

        .cs-social {
            display: flex;
            gap: var(--space-md);
        }
    </style>
</head>

<body>
    <div class="cs-wrap">
        <div class="cs-logo">
            <svg viewBox="0 0 40 24" width="48" height="29" aria-hidden="true">
                <path class="wave-line wave-line-1" d="M2,12 C5,7 7,17 10,12 C12,9 13,15 15,12" />
                <path class="wave-line wave-line-2" d="M2,12 C5,4 7,20 10,12 C12,7 13,17 15,12" />
                <path class="wave-line wave-line-3" d="M2,12 C5,1 7,23 10,12 C12,5 13,19 15,12" />
            </svg>
            <span class="cs-logo-text">W<span class="nav-logo-divider">|</span>S</span>
        </div>

        <h1 class="cs-title">Written in Sound</h1>
        <p class="cs-claim">From Score to Sound</p>
        <p class="cs-text">
            Die neue Website von Stefan Weidner entsteht gerade.
            Schauen Sie bald wieder vorbei – oder melden Sie sich direkt bei uns.
        </p>

        <div class="cs-social">
            <a href="mailto:mannampiano@gmail.com" class="social-link" aria-label="E-Mail">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="m3 7 9 6 9-6" />
                </svg>
            </a>
            <a href="https://www.instagram.com/stefanmusic297/" target="_blank" rel="noopener noreferrer"
                class="social-link" aria-label="Instagram">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                    <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
                </svg>
            </a>
            <a href="https://www.youtube.com/@dermannampiano" target="_blank" rel="noopener noreferrer"
                class="social-link" aria-label="YouTube">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17" />
                    <path d="m10 15 5-3-5-3z" />

        </div>
    </div>
</body>

</html>
